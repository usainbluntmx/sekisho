name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts (Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx hardhat test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.6
      - run: slither . --filter-paths "node_modules|contracts/mocks" --fail-low

  sdk:
    name: SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run typecheck:examples
      - run: npm test

  kanjo:
    name: Kanjō
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kanjo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/kanjo/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      # Las 12 baterías (incluye la página de pago por HTTP en test:orders)
      - run: npm test

  demo-api:
    name: Demo API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/demo-api/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  create:
    name: create-sekisho
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/create-sekisho
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      # El proyecto generado instala y compila con las versiones publicadas del SDK
      - run: node index.mjs "$RUNNER_TEMP/ci-api" --merchant 0x000000000000000000000000000000000000dEaD
      - run: npm install --no-audit --no-fund && npm run typecheck
        working-directory: ${{ runner.temp }}/ci-api

  sekisho-mcp:
    name: sekisho-mcp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sekisho-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/sekisho-mcp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  interop:
    name: Interop (x402 clients)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/demo-api/package-lock.json
            interop/node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
        working-directory: apps/demo-api
      - run: npm ci --no-audit --no-fund
        working-directory: interop/node
      - run: pip install -r interop/python/requirements.txt
      # Demo API real con un facilitador que verifica la firma EIP-3009 (sin cadena ni fondos)
      - name: Servidor local
        working-directory: apps/demo-api
        run: |
          nohup npm run interop:server > "$RUNNER_TEMP/interop.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4402/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/interop.log"; exit 1
      - name: Paga con @x402/fetch (sin SDK de Sekisho)
        working-directory: interop/node
        run: npm run pay
      - name: Paga con x402 para Python
        run: python interop/python/pay.py
      - name: Log del servidor
        if: always()
        run: cat "$RUNNER_TEMP/interop.log"

  ops:
    name: Ops
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ops/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build